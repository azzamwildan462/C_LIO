/**:
  ros__parameters:
    # ---- Map Correction (master switch for loop closure + GPS factors) ----
    map_correction: true # false = odometry-only graph (no LC, no GPS correction)
    debug/print_lio_sam_opt: true # printf dashboard with GPS, fused pose, LC stats

    # ---- Loop Closure Detection (LIO-SAM style: distance-based KD-tree) ----
    loop_detection_period_ms: 3000 # Hz = 1000/period_ms (higher = less CPU)
    loop_closure/search_radius: 15.0 # meters, spatial proximity for LC candidate
    loop_closure/search_time_diff: 10.0 # seconds, min temporal gap to avoid recent frames
    loop_closure/search_num: 25 # +/- keyframes to aggregate for history submap
    loop_closure/fitness_score_threshold: 0.4
    loop_closure/min_keyframe_gap: 25 # min index gap between LC pair

    # ---- Scan Context++ (secondary / fallback loop closure) ----
    sc/enabled: true
    sc/max_range: 40.0
    sc/distance_threshold: 0.5
    sc/ground_height_threshold: 0.0
    sc/search_window: 7

    # ---- Registration for LC verification ----
    # Options: "gicp", "gicp_cuda", "ndt", "ndt_cuda", "robust_icp", "robust_icp_cuda"
    registration_method: "gicp_cuda"
    icp/max_iterations: 100
    icp/max_correspondence_distance: 30.0 # 2x search_radius
    icp/transformation_epsilon: 0.000001
    gicp/k_correspondences: 20
    gicp/rotation_epsilon: 0.01
    ndt/resolution: 3.0
    ndt/num_threads: 4

    voxel_leaf_size: 1.5

    # ---- GPS ----
    gps/enabled: true
    gps/topic: "/gps/fix"
    gps/cov_threshold: 2.0 # max GPS covariance to accept
    gps/pose_cov_threshold: 25.0 # min pose covariance to trigger GPS factor (only used when gating_mode: "covariance")
    gps/use_elevation: true
    gps/min_accuracy: 5.0 # max horizontal accuracy (meters)
    gps/min_noise_floor: 0.5 # meters, minimum sigma for GPS factor noise (0.1=RTK tight, 0.5=safe, 1.0=conservative)
    gps/gating_mode: "always" # "always" = add GPS wherever available, "covariance" = original LIO-SAM behavior
    gps/lc_search_radius: 20.0 # meters, search radius for GPS-based loop closure detection
    gps/fused_drift_rate: 0.5 # m²/s — fused pose covariance growth rate when GPS lost
    gps/buffer_margin: 10.0 # seconds, GPS buffer window around predicted KF timestamp

    # ---- iSAM2 / Batch ----
    isam/relinearize_threshold: 0.01
    isam/relinearize_skip: 1
    isam/batch_optimization: true # run LM batch optimization periodically (better for large corrections)
    isam/batch_optimization_interval: 500 # run batch every N keyframes (lower = more accurate but slower)

    # ---- Noise model ----
    odom_noise/rotation: 0.2 # odometry rotation variance (higher = trust odom less)
    odom_noise/translation: 9.0 # odometry translation variance
    odom_prior_noise/rotation: 1.0 # weak absolute prior for no-GPS poses (rad² variance)
    odom_prior_noise/translation: 100.0 # weak absolute prior for no-GPS poses (m² variance, sigma~10m)
    correction_gate/max_jump: 5.0 # meters — reject T_map_odom correction if position jumps more than this
    correction_gate/max_rotation_deg: 30.0 # degrees — reject if rotation jumps more than this
    loop_noise/multiplier: 0.01 # loop closure noise = fitness * this (lower = trust LC more)

    # ---- Corrected fusion pose (KF fusion: odom delta + PGO correction) ----
    fusion/odom_noise: 0.01 # m²/m — process noise growth per meter of odom movement
    fusion/correction_noise: 1.0 # m² — measurement noise of corrected pose from PGO

    # ---- TF source ----
    # Who publishes map→odom TF: "odom" (OdomNode) or "lio_sam_opt"
    # In localization mode, OdomNode always publishes regardless of this setting.
    # NOTE: this must match the value in params.yaml — do NOT override here,
    # otherwise OdomNode and LioSamMapOptimizationNode get different values
    # and BOTH publish map→odom TF simultaneously, causing TF jumping.
    # Set map/tf_source in params.yaml only.
    # map/tf_source: "lio_sam_opt"

    # ---- Map save ----
    map/voxel_size: 0.1
    map/auto_save_interval: 30.0 # seconds (0 = disabled)
    map/publish_interval: 5.0 # seconds between corrected map publishes
    map/global_map_vis_radius: 1000.0 # meters
