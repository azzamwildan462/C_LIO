/**:
  ros__parameters:
    use_sim_time: true

    debug/odom: false
    debug/graph_slam: false
    debug/print_odom: true # Activate this to print odometry like default DLIO

    frames/map: map
    frames/odom: odom
    frames/baselink: base_link
    frames/lidar: lidar
    frames/imu: imu

    map/waitUntilMove: true
    map/dense/filtered: false
    map/sparse/leafSize: 0.25

    map/mode: "localization"
    map/path: "" # empty = defaults to $HOME/.ros/dlio_map.pcd
    map/use_corrected: true # load graph-optimized _corrected files in localization mode
    map/voxel_size: 0.25
    map/chunk_size: 20.0
    map/auto_save_interval: 30.0
    map/publish_interval: 5.0 # throttle map/corrected_map publish (seconds)
    map/initial_pose/x: 0.0
    map/initial_pose/y: 0.0
    map/initial_pose/z: 0.0
    map/initial_pose/yaw: 0.0
    map/relocalize: true
    map/relocalize/sc_max_range: 150.0
    map/relocalize/sc_num_candidates: 50
    map/relocalize/sc_distance_threshold: 2.0
    map/relocalize/sc_max_attempts: 10
    map/relocalize/sc_ground_height_threshold: 0.3 # meters, 0 = disabled. Removes flat ground for more discriminative SC
    map/relocalize/sc_search_window: 7 # SC++ sector key search window (±3 shifts around coarse alignment)

    map/continuous_localize: true
    map/continuous_localize/on_mapping: false # also run during mapping mode (drift correction vs prior map) (Masih experimental..)
    map/continuous_localize/interval: 2.0
    map/continuous_localize/fitness_threshold: 0.10
    map/continuous_localize/virtual_place_prior: 0.8
    map/continuous_localize/loop_threshold: 0.5
    map/continuous_localize/min_consecutive: 2
    map/continuous_localize/max_correction: 2000.0
    map/continuous_localize/enable_global_correction: true
    map/continuous_localize/sc_distance_threshold: 1.0
    map/continuous_localize/sc_top_k: 3
    map/continuous_localize/g2o_verification: true
    map/continuous_localize/g2o_chi2_threshold: 1.0
    map/continuous_localize/g2o_iterations: 10

    map/submap_localize: true
    map/submap_localize/interval: 1.0
    map/submap_localize/group_size: 10
    map/submap_localize/search_radius: 50.0
    map/submap_localize/fitness_threshold: 0.17
    map/submap_localize/prob_threshold: 0.6
    map/submap_localize/motion_error_threshold: 1.0
    map/submap_localize/motion_rot_threshold: 5.0
    map/submap_localize/min_motion_validations: 3
    map/submap_localize/prob_drop_threshold: 0.3
    map/submap_localize/sc_distance_threshold: 0.6
    map/submap_localize/sc_accum_scans: 10
    map/submap_localize/max_correction: 555555555.0 # infinity

    # GPS
    gps/enabled: true
    gps/topic: "/carla/ego_vehicle/gnss"
    gps/origin/latitude: 0.0 # 0 = use first GPS fix
    gps/origin/longitude: 0.0
    gps/origin/altitude: 0.0
    gps/search_radius: 69.0 # meters, KF search radius for GPS loop closure
    gps/min_accuracy: 5.0 # meters, reject GPS with worse horizontal accuracy
    gps/publish_earth_tf: true # publish earth→map static TF
    gps/trust_all: true # bypass status + accuracy filters (for simulation)

    # ====================================================================================================================================================

    odom/gravity: 9.80665
    odom/computeTimeOffset: true

    odom/imu/approximateGravity: false
    odom/imu/calibration/gyro: true
    odom/imu/calibration/accel: true
    odom/imu/calibration/time: 3.0
    odom/imu/bufferSize: 5000

    odom/preprocessing/cropBoxFilter/size: 1.0
    odom/preprocessing/voxelFilter/res: 0.25

    odom/keyframe/threshD: 0.3
    odom/keyframe/threshR: 10.0

    odom/submap/keyframe/knn: 10
    odom/submap/keyframe/kcv: 10
    odom/submap/keyframe/kcc: 10
    odom/registration_method: "ndt" # "gicp" or "ndt"

    odom/ndt/resolution: 1.0
    odom/ndt/num_threads: 4
    odom/ndt/search_method: "DIRECT7" # KDTREE, DIRECT1, DIRECT7, DIRECT26
    odom/ndt/step_size: 0.3

    odom/gicp/minNumPoints: 64
    odom/gicp/kCorrespondences: 16
    odom/gicp/maxCorrespondenceDistance: 1.5
    odom/gicp/maxIterations: 32
    odom/gicp/transformationEpsilon: 0.01
    odom/gicp/rotationEpsilon: 0.01
    odom/gicp/initLambdaFactor: 0.000000001

    odom/geo/Kp: 4.5
    odom/geo/Kv: 11.25
    odom/geo/Kq: 4.0
    odom/geo/Kab: 2.25
    odom/geo/Kgb: 1.0
    odom/geo/abias_max: 5.0
    odom/geo/gbias_max: 0.5

    # ====================================================================================================================================================

    # Occupancy Grid
    # Not all tested yet, use with caution and report any issues!
    occupancy_grid/enabled: false
    occupancy_grid/grid_size_x: 100.0
    occupancy_grid/grid_size_y: 100.0
    occupancy_grid/resolution: 0.4
    occupancy_grid/ground_threshold: -0.3
    occupancy_grid/obstacle_min_height: 0.1
    occupancy_grid/obstacle_max_height: 3.0
    occupancy_grid/p_occupied: 0.7
    occupancy_grid/p_free: 0.3
    occupancy_grid/p_prior: 0.5
    occupancy_grid/lo_clamped_min: -4.0
    occupancy_grid/lo_clamped_max: 4.0
    occupancy_grid/decay_rate: 0.0
    occupancy_grid/obstacle_margin: 0.3
    occupancy_grid/height_offset: 0.0 # offset from lidar height (+ = higher, - = lower)
    occupancy_grid/adaptive_ground: true # slope-based ground segmentation (for uneven terrain)
    occupancy_grid/ground_slope_threshold: 30.0 # degrees — max slope to still consider ground
    occupancy_grid/scan_angle_target: 0.0 # degrees, 0 = robot forward
    occupancy_grid/scan_angle_tolerance: 180.0 # degrees, 180 = full 360° (no filter)
    occupancy_grid/update_rate: 2.0
