###########################################################
#                   Odometry Pipeline                     #
# Preprocessing, Registration, Keyframes, Submap          #
###########################################################

/**:
  ros__parameters:
    # --- Preprocessing ---
    odom/preprocessing/cropBoxFilter/size: 3.0
    odom/preprocessing/voxelFilter/res: 1.0
    odom/preprocessing/gpu: true # GPU deskewing + voxel grid filter (requires CUDA)

    # Prefilter (noise removal) — applied after deskewing
    odom/prefilter/method: "none" # "none", "sor", "sor_cuda", "ror", "dror"
    odom/prefilter/mean_k: 10
    odom/prefilter/stddev_mul: 1.0
    odom/prefilter/radius: 0.5
    odom/prefilter/min_neighbors: 3
    odom/prefilter/dror_min_radius: 0.1
    odom/prefilter/dror_max_radius: 3.0
    odom/prefilter/dror_range_scale: 0.01
    odom/prefilter/dror_min_neighbors: 3

    # --- Registration ---
    odom/registration_method: "gicp_cuda" # "gicp", "gicp_cuda", "ndt", "ndt_cuda", "robust_icp", "robust_icp_cuda"
    odom/localization/registration_method: "gicp"

    # GICP
    odom/gicp/minNumPoints: 100
    odom/gicp/kCorrespondences: 16
    odom/gicp/maxCorrespondenceDistance: 5.0
    odom/gicp/maxIterations: 64
    odom/gicp/transformationEpsilon: 0.001
    odom/gicp/rotationEpsilon: 0.001
    odom/gicp/initLambdaFactor: 0.000000001

    # NDT
    odom/ndt/resolution: 4.0
    odom/ndt/num_threads: 8
    odom/ndt/search_method: "DIRECT7" # KDTREE, DIRECT1, DIRECT7, DIRECT26
    odom/ndt/step_size: 0.12

    # Robust ICP
    odom/robust_icp/kernel_scale: 0.0 # GM kernel sigma (0 = auto)

    # --- Keyframes ---
    odom/keyframe/threshD: 1.0 # meters
    odom/keyframe/threshR: 1.0 # degrees

    # --- Submap ---
    # method: "keyframe" (KNN + convex/concave hull) | "voxel_hash_map" | "recent_keyframes"
    #   "recent_keyframes" pakai hanya N keyframe terbaru — robust untuk odom
    #   forward-moving, hindari keyframe lawas narik registrasi.
    odom/submap/method: "keyframe"
    odom/submap/keyframe/knn: 15
    odom/submap/keyframe/kcv: 15
    odom/submap/keyframe/kcc: 15
    odom/submap/recent/n: 30
    odom/submap/voxel_hash_map/voxel_size: 0.75
    odom/submap/voxel_hash_map/max_distance: 200.0
    odom/submap/voxel_hash_map/max_points_per_voxel: 40
